<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>{% block title %}CasaLista — Control & Presupuesto del Hogar{% endblock %}</title>
  
  <!-- Google Fonts: Manrope & Hanken Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..900;1,300..900&family=Manrope:wght@200..800&display=swap" rel="stylesheet"/>
  
  <!-- Google Material Symbols Outlined -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00236f",
            "primary-container": "#1e3a8a",
            "on-primary": "#ffffff",
            "on-primary-container": "#90a8ff",
            "primary-fixed": "#dce1ff",
            "primary-fixed-dim": "#b6c4ff",
            "secondary": "#0051d5",
            "secondary-container": "#316bf3",
            "on-secondary": "#ffffff",
            "on-secondary-container": "#fefcff",
            "secondary-fixed": "#dbe1ff",
            "secondary-fixed-dim": "#b4c5ff",
            "tertiary": "#1d2b3a",
            "tertiary-container": "#334151",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#9eadc0",
            "tertiary-fixed": "#d5e4f8",
            "tertiary-fixed-dim": "#b9c8db",
            "background": "#faf8ff",
            "surface": "#faf8ff",
            "surface-dim": "#d2d9f4",
            "surface-bright": "#faf8ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "surface-container": "#eaedff",
            "surface-container-high": "#e2e7ff",
            "surface-container-highest": "#dae2fd",
            "surface-variant": "#dae2fd",
            "on-surface": "#131b2e",
            "on-surface-variant": "#444651",
            "outline": "#757682",
            "outline-variant": "#c5c5d3",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error": "#ffffff",
            "on-error-container": "#93000a"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-sm": "0.5rem",
            "space-md": "1rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem",
            "gutter": "1rem",
            "margin": "1rem"
          },
          fontFamily: {
            "headline-lg": ["Manrope", "sans-serif"],
            "headline-md": ["Manrope", "sans-serif"],
            "headline-sm": ["Manrope", "sans-serif"],
            "display-currency": ["Manrope", "sans-serif"],
            "body-lg": ["Hanken Grotesk", "sans-serif"],
            "body-md": ["Hanken Grotesk", "sans-serif"],
            "body-sm": ["Hanken Grotesk", "sans-serif"],
            "label-lg": ["Hanken Grotesk", "sans-serif"],
            "label-md": ["Hanken Grotesk", "sans-serif"],
            "label-sm": ["Hanken Grotesk", "sans-serif"]
          },
          fontSize: {
            "display-currency": ["32px", { lineHeight: "38px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "headline-lg": ["24px", { lineHeight: "30px", letterSpacing: "-0.015em", fontWeight: "700" }],
            "headline-md": ["20px", { lineHeight: "26px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-sm": ["16px", { lineHeight: "22px", letterSpacing: "0em", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", letterSpacing: "0em", fontWeight: "400" }],
            "body-md": ["14px", { lineHeight: "20px", letterSpacing: "0em", fontWeight: "400" }],
            "body-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.01em", fontWeight: "400" }],
            "label-lg": ["14px", { lineHeight: "18px", letterSpacing: "0.01em", fontWeight: "600" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
            "label-sm": ["10px", { lineHeight: "12px", letterSpacing: "0.04em", fontWeight: "700" }]
          }
        }
      }
    };
  </script>

  <style>
    @layer base {
      html, body {
        width: 100%;
        margin: 0;
        padding: 0;
        background-color: #faf8ff;
      }
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-on-surface antialiased flex flex-col min-h-screen selection:bg-secondary-fixed selection:text-on-secondary-fixed">
  
  {% block content %}{% endblock %}

  {% block bottom_nav %}
    {% if active_nav %}
      {% include "components/bottom_nav.html" %}
    {% endif %}
  {% endblock %}

  {% include "components/modal.html" %}

  {% block scripts %}{% endblock %}
</body>
</html>
