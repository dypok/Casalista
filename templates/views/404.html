{% extends "base.html" %}

{% block title %}Página no encontrada — CasaLista{% endblock %}

{% block content %}

    <div class="w-16 h-16 rounded-2xl bg-secondary-fixed text-primary flex items-center justify-center mb-4">

      <span class="material-symbols-outlined text-[20px]">home</span>
