{% if level == 'green' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-800 border border-emerald-200 font-label-sm text-label-sm font-semibold">
    <span class="material-symbols-outlined text-[15px] text-emerald-600" style="font-variation-settings: 'FILL' 1;">check_circle</span>
    {{ label | default('Reparación sencilla') }}
  </span>
{% elif level == 'yellow' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200 font-label-sm text-label-sm font-semibold">
    <span class="material-symbols-outlined text-[15px] text-amber-600" style="font-variation-settings: 'FILL' 1;">warning</span>
    {{ label | default('Precaución requerida') }}
  </span>
{% elif level == 'red' %}
  <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-rose-50 text-rose-800 border border-rose-200 font-label-sm text-label-sm font-semibold">
    <span class="material-symbols-outlined text-[15px] text-rose-600" style="font-variation-settings: 'FILL' 1;">gpp_bad</span>
    {{ label | default('Requiere un profesional') }}
  </span>
{% endif %}
